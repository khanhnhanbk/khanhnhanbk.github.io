<!doctype html>
<!-- Nguồn của public/og.jpg (1200×630). Chạy: node scripts/og/make-og.mjs
     LUẬT: mọi chữ + ảnh chính nằm trong ô vuông 630×630 ở giữa (x 285–915),
     vì Facebook (bình luận, Messenger, Zalo) cắt ảnh thành ô vuông giữa. -->
<html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;color:#f4f2ec;
    background:
      radial-gradient(520px 420px at 8% 10%, #1f6f5c 0%, transparent 70%),
      radial-gradient(520px 420px at 95% 95%, #8a6d2b 0%, transparent 70%),
      radial-gradient(460px 360px at 45% 105%, #1f3566 0%, transparent 70%),
      #0e1311}
  .the{position:absolute;inset:44px 60px;border-radius:36px;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .giua{position:absolute;left:285px;top:0;width:630px;height:630px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:0 24px}
  img{width:150px;height:150px;border-radius:32px;object-fit:cover;border:3px solid rgba(255,255,255,.22);margin-bottom:26px}
  h1{font-size:50px;white-space:nowrap;line-height:1.12;font-weight:800;letter-spacing:-.5px}
  h1 span{background:linear-gradient(90deg,#6fd3a8,#e9c35a);-webkit-background-clip:text;color:transparent}
  p{margin-top:20px;font-size:23px;font-weight:500;color:#cfd6d2}
  .url{margin-top:10px;font-size:22px;font-weight:600;color:#7fdcb4}
  .khung{position:absolute;left:285px;top:0;width:630px;height:630px;outline:2px dashed red;display:none}
  body.kiem .khung{display:block}
</style></head>
<body>
  <div class="the"></div>
  <div class="giua">
    <img src="../../public/avatar.jpg" alt="">
    <h1>Website &amp; phần mềm<br><span>cho doanh nghiệp nhỏ</span></h1>
    <p>Nguyễn Văn Khánh Nhân · Kỹ sư phần mềm</p>
    <div class="url">khanhnhanbk.github.io</div>
  </div>
  <div class="khung"></div>
</body></html>
